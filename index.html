<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صرافی DARK | قیمت لحظه‌ای ارز دیجیتال</title>
    <style>
        :root {
            --bg: #0a0e17;
            --card-bg: #131a26;
            --text: #e6edf3;
            --accent: #f0b90b; /* DARK gold */
            --green: #0ecb81;
            --red: #f6465d;
            --border: #2a3544;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(240, 185, 11, 0.3);
        }
        header p {
            color: #8b9bb4;
            margin-top: 0.5rem;
            font-size: 1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.2rem;
            width: 100%;
            max-width: 1200px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-color: var(--accent);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .coin-name {
            font-size: 1.25rem;
            font-weight: 700;
        }
        .coin-symbol {
            color: #8b9bb4;
            font-size: 0.9rem;
            margin-right: 0.4rem;
        }
        .price {
            font-size: 1.9rem;
            font-weight: 800;
            direction: ltr;
            text-align: right;
            color: #fff;
        }
        .change {
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            direction: ltr;
            display: inline-block;
            margin-top: 0.5rem;
        }
        .change.up {
            color: var(--green);
            background: rgba(14, 203, 129, 0.1);
        }
        .change.down {
            color: var(--red);
            background: rgba(246, 70, 93, 0.1);
        }
        .status-bar {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #8b9bb4;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .refresh-btn:hover {
            background: var(--border);
        }
        footer {
            margin-top: 3rem;
            text-align: center;
            color: #5a6a80;
            font-size: 0.85rem;
        }
        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .price { font-size: 1.5rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>صرافی DARK</h1>
        <p>قیمت لحظه‌ای بازارهای ارز دیجیتال</p>
    </header>

    <main class="grid" id="priceGrid">
        <!-- کارت‌ها با جاوااسکریپت پر می‌شوند -->
    </main>

    <div class="status-bar">
        <span class="dot"></span>
        <span>متصل به API</span>
        <span>•</span>
        <span id="lastUpdate">در حال دریافت...</span>
        <button class="refresh-btn" onclick="fetchAllPrices()">🔄 بروزرسانی</button>
    </div>

    <footer>
        صرافی DARK © ۲۰۲۶ | داده‌ها از CoinGecko
    </footer>

    <script>
        // ============================================================
        // تنظیمات ارزها (برای اضافه کردن ارز جدید، فقط اینجا را ویرایش کنید)
        // ============================================================
        const COINS = [
            { id: 'tether', name: 'تتر', symbol: 'USDT' },
            { id: 'the-open-network', name: 'تون', symbol: 'TON' },
            { id: 'tron', name: 'ترون', symbol: 'TRX' },
            { id: 'bitcoin', name: 'بیت کوین', symbol: 'BTC' },
            { id: 'ethereum', name: 'اتریوم', symbol: 'ETH' },
            { id: 'usd-coin', name: 'دلار', symbol: 'USDC' } // USDC به عنوان نماینده دلار دیجیتال
        ];

        // ============================================================
        // API تنظیمات
        // ============================================================
        const API_URL = 'https://api.coingecko.com/api/v3/simple/price';
        const REFRESH_INTERVAL = 60000; // هر ۶۰ ثانیه

        // ============================================================
        // توابع کمکی
        // ============================================================
        function formatPrice(price) {
            if (price >= 1000) {
                return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } else if (price >= 1) {
                return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
            } else {
                return price.toLocaleString('en-US', { minimumFractionDigits: 4, maximumFractionDigits: 6 });
            }
        }

        function formatChange(change) {
            if (change === undefined || change === null) return '—';
            const sign = change >= 0 ? '+' : '';
            return `${sign}${change.toFixed(2)}%`;
        }

        function getChangeClass(change) {
            if (change === undefined || change === null) return '';
            return change >= 0 ? 'up' : 'down';
        }

        // ============================================================
        // ساخت کارت‌ها در DOM
        // ============================================================
        function buildCards() {
            const grid = document.getElementById('priceGrid');
            grid.innerHTML = ''; // پاک کردن

            COINS.forEach(coin => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${coin.id}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <span class="coin-name">${coin.name}</span>
                            <span class="coin-symbol">${coin.symbol}</span>
                        </div>
                    </div>
                    <div class="price" id="price-${coin.id}">—</div>
                    <div class="change" id="change-${coin.id}">—</div>
                `;
                grid.appendChild(card);
            });
        }

        // ============================================================
        // دریافت قیمت‌ها از API
        // ============================================================
        async function fetchAllPrices() {
            try {
                const ids = COINS.map(c => c.id).join(',');
                const response = await fetch(
                    `${API_URL}?ids=${ids}&vs_currencies=usd&include_24hr_change=true`
                );
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                // به‌روزرسانی DOM
                COINS.forEach(coin => {
                    const priceEl = document.getElementById(`price-${coin.id}`);
                    const changeEl = document.getElementById(`change-${coin.id}`);
                    const coinData = data[coin.id];

                    if (coinData && coinData.usd !== undefined) {
                        priceEl.textContent = '$' + formatPrice(coinData.usd);
                        const change = coinData.usd_24h_change;
                        changeEl.textContent = formatChange(change);
                        changeEl.className = 'change ' + getChangeClass(change);
                    } else {
                        priceEl.textContent = 'N/A';
                        changeEl.textContent = '—';
                        changeEl.className = 'change';
                    }
                });

                // به‌روزرسانی وضعیت
                const now = new Date().toLocaleTimeString('fa-IR');
                document.getElementById('lastUpdate').textContent = `آخرین بروزرسانی: ${now}`;

            } catch (error) {
                console.error('Error fetching prices:', error);
                document.getElementById('lastUpdate').textContent = 'خطا در دریافت داده — دوباره تلاش کنید';
            }
        }

        // ============================================================
        // شروع
        // ============================================================
        buildCards();
        fetchAllPrices();

        // بروزرسانی خودکار
        setInterval(fetchAllPrices, REFRESH_INTERVAL);
    </script>

</body>
</html>
