<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صرافی DARK | قیمت لحظه‌ای ارز دیجیتال</title>
    <style>
        :root {
            --bg: #0a0e17;
            --card-bg: #131a26;
            --text: #e6edf3;
            --accent: #f0b90b; /* DARK gold */
            --green: #0ecb81;
            --red: #f6465d;
            --border: #2a3544;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(240, 185, 11, 0.3);
        }
        header p {
            color: #8b9bb4;
            margin-top: 0.5rem;
            font-size: 1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.2rem;
            width: 100%;
            max-width: 1400px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-color: var(--accent);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .coin-name {
            font-size: 1.25rem;
            font-weight: 700;
        }
        .coin-symbol {
            color: #8b9bb4;
            font-size: 0.9rem;
            margin-right: 0.4rem;
        }
        .price-usd {
            font-size: 1.6rem;
            font-weight: 800;
            direction: ltr;
            text-align: right;
            color: #fff;
        }
        .change {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            direction: ltr;
            display: inline-block;
            margin-top: 0.3rem;
        }
        .change.up {
            color: var(--green);
            background: rgba(14, 203, 129, 0.1);
        }
        .change.down {
            color: var(--red);
            background: rgba(246, 70, 93, 0.1);
        }
        .price-toman {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
            direction: rtl;
            text-align: right;
            margin-top: 0.8rem;
            padding-top: 0.6rem;
            border-top: 1px dashed var(--border);
        }
        .status-bar {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #8b9bb4;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .refresh-btn:hover {
            background: var(--border);
        }
        footer {
            margin-top: 3rem;
            text-align: center;
            color: #5a6a80;
            font-size: 0.85rem;
        }
        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .price-usd { font-size: 1.3rem; }
            .price-toman { font-size: 1rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>صرافی DARK</h1>
        <p>قیمت لحظه‌ای بازارهای ارز دیجیتال (دلار و تومان)</p>
    </header>

    <main class="grid" id="priceGrid">
        <!-- کارت‌ها با جاوااسکریپت پر می‌شوند -->
    </main>

    <div class="status-bar">
        <span class="dot"></span>
        <span>متصل به API</span>
        <span>•</span>
        <span id="lastUpdate">در حال دریافت...</span>
        <button class="refresh-btn" onclick="fetchAllPrices()">🔄 بروزرسانی</button>
    </div>

    <footer>
        صرافی DARK © ۲۰۲۶ | داده‌ها از CoinGecko و Nobitex
    </footer>

    <script>
        // ============================================================
        // لیست کامل ۱۵ ارز (شناسه CoinGecko + نماد نوبیتکس)
        // برای اضافه کردن ارز جدید، فقط یک شیء جدید به این آرایه اضافه کنید.
        // ============================================================
        const COINS = [
            // --- ۵ ارز اولیه ---
            { id: 'tether',            name: 'تتر',          symbol: 'USDT', nobitex: 'usdt' },
            { id: 'the-open-network',  name: 'تون',          symbol: 'TON',  nobitex: 'ton'  },
            { id: 'tron',              name: 'ترون',         symbol: 'TRX',  nobitex: 'trx'  },
            { id: 'bitcoin',           name: 'بیت کوین',     symbol: 'BTC',  nobitex: 'btc'  },
            { id: 'ethereum',          name: 'اتریوم',       symbol: 'ETH',  nobitex: 'eth'  },
            // --- ۱۰ ارز جدید پرطرفدار ---
            { id: 'solana',            name: 'سولانا',       symbol: 'SOL',  nobitex: 'sol'  },
            { id: 'ripple',            name: 'ریپل',         symbol: 'XRP',  nobitex: 'xrp'  },
            { id: 'dogecoin',          name: 'دوج کوین',     symbol: 'DOGE', nobitex: 'doge' },
            { id: 'cardano',           name: 'کاردانو',      symbol: 'ADA',  nobitex: 'ada'  },
            { id: 'binancecoin',       name: 'بایننس کوین',  symbol: 'BNB',  nobitex: 'bnb'  },
            { id: 'avalanche-2',       name: 'آوالانچ',      symbol: 'AVAX', nobitex: 'avax' },
            { id: 'chainlink',         name: 'چین لینک',     symbol: 'LINK', nobitex: 'link' },
            { id: 'polkadot',          name: 'پولکادات',     symbol: 'DOT',  nobitex: 'dot'  },
            { id: 'shiba-inu',         name: 'شیبا اینو',    symbol: 'SHIB', nobitex: 'shib' },
            { id: 'litecoin',          name: 'لایت کوین',    symbol: 'LTC',  nobitex: 'ltc'  },
        ];

        const COINGECKO_URL = 'https://api.coingecko.com/api/v3/simple/price';
        const NOBITEX_URL = 'https://apiv2.nobitex.ir/market/stats';
        const REFRESH_INTERVAL = 60000; // ۶۰ ثانیه

        // ============================================================
        // توابع کمکی
        // ============================================================
        function formatUSD(price) {
            if (price >= 1000) return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            if (price >= 1) return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
            return price.toLocaleString('en-US', { minimumFractionDigits: 4, maximumFractionDigits: 6 });
        }

        function formatChange(change) {
            if (change === undefined || change === null) return '—';
            const sign = change >= 0 ? '+' : '';
            return `${sign}${change.toFixed(2)}%`;
        }

        function getChangeClass(change) {
            if (change === undefined || change === null) return '';
            return change >= 0 ? 'up' : 'down';
        }

        // ============================================================
        // ساخت کارت‌ها در DOM
        // ============================================================
        function buildCards() {
            const grid = document.getElementById('priceGrid');
            grid.innerHTML = '';

            COINS.forEach(coin => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${coin.id}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <span class="coin-name">${coin.name}</span>
                            <span class="coin-symbol">${coin.symbol}</span>
                        </div>
                    </div>
                    <div class="price-usd" id="price-usd-${coin.id}">—</div>
                    <div class="change" id="change-usd-${coin.id}">—</div>
                    <div class="price-toman" id="price-toman-${coin.id}">— تومان</div>
                `;
                grid.appendChild(card);
            });
        }

        // ============================================================
        // دریافت قیمت دلاری از CoinGecko
        // ============================================================
        async function fetchUSDTPrices() {
            try {
                const ids = COINS.map(c => c.id).join(',');
                const res = await fetch(
                    `${COINGECKO_URL}?ids=${ids}&vs_currencies=usd&include_24hr_change=true`
                );
                if (!res.ok) throw new Error('CoinGecko response error');
                const data = await res.json();

                COINS.forEach(coin => {
                    const priceEl = document.getElementById(`price-usd-${coin.id}`);
                    const changeEl = document.getElementById(`change-usd-${coin.id}`);
                    const d = data[coin.id];

                    if (d && d.usd !== undefined) {
                        priceEl.textContent = '$' + formatUSD(d.usd);
                        const ch = d.usd_24h_change;
                        changeEl.textContent = formatChange(ch);
                        changeEl.className = 'change ' + getChangeClass(ch);
                    } else {
                        priceEl.textContent = 'N/A';
                        changeEl.textContent = '—';
                        changeEl.className = 'change';
                    }
                });
            } catch (e) {
                console.error('خطا در دریافت قیمت دلاری:', e);
            }
        }

        // ============================================================
        // دریافت قیمت تومانی از نوبیتکس (تبدیل ریال به تومان)
        // ============================================================
        async function fetchTomanPrices() {
            try {
                const srcList = COINS.map(c => c.nobitex).join(',');
                const res = await fetch(`${NOBITEX_URL}?srcCurrency=${srcList}&dstCurrency=rls`);
                if (!res.ok) throw new Error('Nobitex response error');
                const data = await res.json();

                if (data.status !== 'ok' || !data.stats) {
                    console.warn('پاسخ نامعتبر از نوبیتکس:', data);
                    return;
                }

                COINS.forEach(coin => {
                    const el = document.getElementById(`price-toman-${coin.id}`);
                    const marketKey = `${coin.nobitex.toUpperCase()}IRT`;
                    const marketData = data.stats[marketKey];

                    if (marketData && marketData.latest) {
                        // نوبیتکس قیمت را به ریال می‌دهد؛ تقسیم بر ۱۰ برای تومان
                        const toman = parseFloat(marketData.latest) / 10;
                        el.textContent = toman.toLocaleString('fa-IR', { maximumFractionDigits: 0 }) + ' تومان';
                    } else {
                        el.textContent = '— تومان';
                    }
                });
            } catch (e) {
                console.error('خطا در دریافت قیمت تومانی:', e);
            }
        }

        // ============================================================
        // اجرای همزمان هر دو درخواست
        // ============================================================
        async function fetchAllPrices() {
            await Promise.all([fetchUSDTPrices(), fetchTomanPrices()]);
            const now = new Date().toLocaleTimeString('fa-IR');
            document.getElementById('lastUpdate').textContent = `آخرین بروزرسانی: ${now}`;
        }

        // ============================================================
        // شروع
        // ============================================================
        buildCards();
        fetchAllPrices();
        setInterval(fetchAllPrices, REFRESH_INTERVAL);
    </script>

</body>
</html>
