<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قیمت لحظه‌ای ارز | صرافی DARK</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0e17;
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: radial-gradient(circle at 20% 20%, #1e293b 0%, #0a0e17 80%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px; /* کاهش پدینگ برای موبایل */
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: rgba(59, 130, 246, 0.08);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
        }

        h1 {
            font-size: 1.3rem; /* کوچک‌تر برای موبایل */
            font-weight: 800;
            margin-bottom: 4px;
            text-align: center;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 8px;
            text-align: center;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2s infinite;
        }

        .dot.error {
            background: var(--red);
            box-shadow: 0 0 8px var(--red);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        /* گرید بهینه برای موبایل: دو ستونه */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }

        /* در دسکتاپ ۳ یا ۴ ستونه شود */
        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
                max-width: 900px;
            }
            h1 { font-size: 1.8rem; }
            .subtitle { font-size: 0.9rem; }
            .card { padding: 18px; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px; /* پدینگ کمتر برای موبایل */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 8px 20px -8px var(--accent-glow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .currency-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .currency-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--accent);
        }

        .currency-name {
            font-size: 0.8rem;
            font-weight: 700;
        }

        .currency-symbol {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-family: monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .price-container {
            display: flex;
            align-items: baseline;
            gap: 4px;
            margin-bottom: 4px;
            flex-wrap: wrap; /* جلوگیری از سرریز */
        }

        .price {
            font-size: 1.1rem; /* کوچک‌تر برای موبایل */
            font-weight: 800;
            letter-spacing: -0.3px;
            direction: ltr;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .price-unit {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .change {
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .change.up { color: var(--green); }
        .change.down { color: var(--red); }
        .change.neutral { color: var(--text-muted); }

        .footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer strong {
            color: var(--accent);
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            height: 16px;
            margin-bottom: 8px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .error-banner {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--red);
            color: #fca5a5;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .error-banner.visible {
            display: block;
        }
    </style>
</head>
<body>

    <h1>💰 قیمت لحظه‌ای ارز</h1>
    <p class="subtitle">به واحد تومان — به‌روزرسانی هر ۱۰ ثانیه</p>

    <div class="status-bar">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">در حال دریافت قیمت‌ها...</span>
    </div>

    <div class="error-banner" id="errorBanner">
        ⚠️ دریافت اطلاعات با خطا مواجه شد. تلاش مجدد در ۱۵ ثانیه آینده...
    </div>

    <div class="grid" id="cardsGrid">
        <!-- کارت‌ها به صورت داینامیک ساخته می‌شوند -->
    </div>

    <div class="footer">
        منبع قیمت‌ها: <strong>صرافی DARK</strong> — قیمت‌ها به صورت لحظه‌ای و دقیق بر اساس بازار آزاد است.
        <br>
        آخرین به‌روزرسانی: <span id="lastUpdated">—</span>
    </div>

    <script>
        // ============================================================
        // تنظیمات
        // ============================================================
        const REFRESH_MS = 10_000;      // هر ۱۰ ثانیه
        const RETRY_MS   = 15_000;      // در صورت خطا، ۱۵ ثانیه بعد دوباره تلاش کن

        const CURRENCIES = [
            { key: 'usd',  name: 'دلار آمریکا', symbol: 'USD',  icon: 'fa-dollar-sign', source: 'priceto' },
            { key: 'usdt', name: 'تتر',          symbol: 'USDT', icon: 'fa-t',          source: 'nobitex' },
            { key: 'trx',  name: 'ترون',          symbol: 'TRX',  icon: 'fa-bolt',       source: 'nobitex' },
            { key: 'btc',  name: 'بیت‌کوین',      symbol: 'BTC',  icon: 'fa-bitcoin',    source: 'nobitex' },
            { key: 'eth',  name: 'اتریوم',        symbol: 'ETH',  icon: 'fa-ethereum',   source: 'nobitex' },
            { key: 'ton',  name: 'تون‌کوین',      symbol: 'TON',  icon: 'fa-gem',        source: 'nobitex' },
            { key: 'doge', name: 'دوج‌کوین',      symbol: 'DOGE', icon: 'fa-dog',        source: 'nobitex' },
        ];

        // آدرس‌های API (ریال)
        const NOBITEX_API = 'https://apiv2.nobitex.ir/market/stats?srcCurrency=usdt,trx,btc,eth,ton,doge&dstCurrency=rls';
        const PRICETO_API = 'https://api.priceto.day/v1/latest/irr/usd';

        // استفاده از پروکسی پایدار برای رفع خطای CORS
        // (allorigins.win یک سرویس رایگان و بدون نیاز به کلید است)
        const PROXY = 'https://api.allorigins.win/raw?url=';

        // ============================================================
        // عناصر DOM
        // ============================================================
        const grid         = document.getElementById('cardsGrid');
        const statusDot    = document.getElementById('statusDot');
        const statusText   = document.getElementById('statusText');
        const lastUpdated  = document.getElementById('lastUpdated');
        const errorBanner  = document.getElementById('errorBanner');

        // ============================================================
        // ابزارهای کمکی
        // ============================================================

        function formatPrice(value) {
            if (value == null || isNaN(value)) return '—';
            return Math.round(value).toLocaleString('en-US');
        }

        function buildSkeletonCards() {
            grid.innerHTML = CURRENCIES.map(c => `
                <div class="card" data-key="${c.key}">
                    <div class="card-header">
                        <div class="currency-info">
                            <div class="skeleton" style="width: 28px; height: 28px; border-radius: 50%;"></div>
                            <div class="skeleton" style="width: 50px; height: 14px;"></div>
                        </div>
                    </div>
                    <div class="skeleton" style="width: 80px; height: 20px; margin-bottom: 4px;"></div>
                    <div class="skeleton" style="width: 40px; height: 12px;"></div>
                </div>
            `).join('');
        }

        function renderRates(rates) {
            CURRENCIES.forEach(c => {
                const card = grid.querySelector(`.card[data-key="${c.key}"]`);
                if (!card) return;

                const data = rates[c.key];
                if (!data) {
                    card.innerHTML = `<div class="currency-name">${c.name}</div><div class="price">—</div>`;
                    return;
                }

                const price = data.price;
                const change = data.change;

                let changeClass = 'neutral';
                let changeText  = '—';
                if (change != null && !isNaN(change)) {
                    if (change > 0) {
                        changeClass = 'up';
                        changeText  = `<i class="fas fa-arrow-up"></i> ${change.toFixed(2)}٪`;
                    } else if (change < 0) {
                        changeClass = 'down';
                        changeText  = `<i class="fas fa-arrow-down"></i> ${Math.abs(change).toFixed(2)}٪`;
                    } else {
                        changeText = '۰.۰۰٪';
                    }
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div class="currency-info">
                            <div class="currency-icon"><i class="fas ${c.icon}"></i></div>
                            <span class="currency-name">${c.name}</span>
                        </div>
                    </div>
                    <div class="price-container">
                        <span class="price">${formatPrice(price)}</span>
                        <span class="price-unit">تومان</span>
                    </div>
                    <div class="change ${changeClass}">${changeText}</div>
                `;
            });

            lastUpdated.textContent = new Date().toLocaleTimeString('fa-IR');
        }

        function setLoading() {
            statusDot.classList.remove('error');
            statusText.textContent = 'در حال دریافت قیمت‌ها...';
            errorBanner.classList.remove('visible');
        }

        function setSuccess() {
            statusDot.classList.remove('error');
            statusText.textContent = 'قیمت‌ها به‌روز است';
            errorBanner.classList.remove('visible');
        }

        function setError(message) {
            statusDot.classList.add('error');
            statusText.textContent = 'خطا در دریافت اطلاعات';
            errorBanner.classList.add('visible');
            if (message) console.error('[Rates]', message);
        }

        // ============================================================
        // دریافت داده از APIها
        // ============================================================

        async function fetchRates() {
            setLoading();

            try {
                // استفاده از Promise.allSettled برای اینکه اگر یکی از APIها خطا داد، دیگری متوقف نشود
                const results = await Promise.allSettled([
                    fetch(PROXY + encodeURIComponent(NOBITEX_API)),
                    fetch(PROXY + encodeURIComponent(PRICETO_API))
                ]);

                const rates = {};
                let hasError = false;

                // پردازش نوبیتکس
                if (results[0].status === 'fulfilled' && results[0].value.ok) {
                    const nobitexData = await results[0].value.json();
                    if (nobitexData.stats) {
                        CURRENCIES.forEach(c => {
                            if (c.source === 'nobitex') {
                                const marketKey = `${c.key}-rls`;
                                const stat = nobitexData.stats[marketKey];
                                if (stat && stat.latest) {
                                    // تبدیل ریال به تومان (تقسیم بر ۱۰)
                                    rates[c.key] = {
                                        price: parseFloat(stat.latest) / 10,
                                        change: stat.dayChange ? parseFloat(stat.dayChange) : null
                                    };
                                }
                            }
                        });
                    }
                } else {
                    hasError = true;
                    console.error('Nobitex fetch failed');
                }

                // پردازش PriceToDay
                if (results[1].status === 'fulfilled' && results[1].value.ok) {
                    const pricetoData = await results[1].value.json();
                    if (pricetoData.price) {
                        rates['usd'] = {
                            price: parseFloat(pricetoData.price) / 10, // تبدیل ریال به تومان
                            change: null
                        };
                    }
                } else {
                    hasError = true;
                    console.error('PriceTo fetch failed');
                }

                if (Object.keys(rates).length === 0) {
                    throw new Error('هیچ داده‌ای دریافت نشد');
                }

                renderRates(rates);

                if (hasError) {
                    // اگر بعضی داده‌ها نیامده باشند، وضعیت را زرد/هشدار نشان بده
                    statusDot.classList.add('error');
                    statusText.textContent = 'برخی قیمت‌ها به‌روز نشد';
                    errorBanner.classList.add('visible');
                } else {
                    setSuccess();
                }

            } catch (err) {
                console.error('[Rates] خطا:', err);
                setError(err.message);
            }
        }

        // ============================================================
        // حلقه به‌روزرسانی
        // ============================================================

        async function updateLoop() {
            await fetchRates();

            const delay = errorBanner.classList.contains('visible')
                ? RETRY_MS
                : REFRESH_MS;

            setTimeout(updateLoop, delay);
        }

        // ============================================================
        // شروع
        // ============================================================

        buildSkeletonCards();
        updateLoop();
    </script>
</body>
</html>
